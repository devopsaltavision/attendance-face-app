<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <style>
      .fp-zone {
        fill: none;
        stroke: #D1D5DB; /* Unregistered state (Gray) */
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.3s ease, transform 0.2s ease;
      }
      
      /* Active / Registered States */
      .fp-zone.active {
        stroke: #3B82F6; /* Active scanning state (Blue) */
      }
      
      .fp-zone.complete {
        stroke: #10B981; /* Registered state (Green) */
      }

      /* Base subtle print outlines */
      .fp-bg {
        fill: none;
        stroke: #F3F4F6;
        stroke-width: 4;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Outer Guide Outline -->
  <path class="fp-bg" d="M 50 120 C 50 50, 150 50, 150 120 C 150 190, 130 210, 100 210 C 70 210, 50 190, 50 120 Z" />

  <!-- 1. TOP ZONE -->
  <g id="zone-top" class="fp-zone">
    <path d="M 75 55 C 88 43, 112 43, 125 55" />
    <path d="M 65 70 C 85 50, 115 50, 135 70" />
  </g>

  <!-- 2. LEFT SIDE ZONE -->
  <g id="zone-left" class="fp-zone">
    <path d="M 45 105 C 45 85, 55 75, 65 70" />
    <path d="M 40 130 C 40 100, 50 85, 60 80" />
    <path d="M 45 155 C 42 140, 42 120, 52 105" />
  </g>

  <!-- 3. RIGHT SIDE ZONE -->
  <g id="zone-right" class="fp-zone">
    <path d="M 135 70 C 145 75, 155 85, 155 105" />
    <path d="M 140 80 C 150 85, 160 100, 160 130" />
    <path d="M 148 105 C 158 120, 158 140, 155 155" />
  </g>

  <!-- 4. CENTER / CORE ZONE -->
  <g id="zone-center" class="fp-zone active">
    <!-- Inner Core Loop -->
    <path d="M 90 120 C 90 105, 110 105, 110 120 C 110 135, 95 140, 95 150" />
    <path d="M 78 115 C 78 90, 122 90, 122 115 C 122 135, 108 145, 108 160" />
  </g>

  <!-- 5. BOTTOM ZONE -->
  <g id="zone-bottom" class="fp-zone">
    <path d="M 60 170 C 75 185, 125 185, 140 170" />
    <path d="M 70 190 C 85 200, 115 200, 130 190" />
  </g>
</svg>
